name: agcriando-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agcriando
      POSTGRES_USER: agcriando
      POSTGRES_PASSWORD: agcriando
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agcriando"]
      interval: 5s
      retries: 10

volumes:
  pgdata: {}
