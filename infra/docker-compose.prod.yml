name: agcriando

# Logs no disco da VM, com rotação (docker compose logs <serviço>).
x-logging: &logs
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

services:
  db:
    logging: *logs
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agcriando
      POSTGRES_USER: agcriando
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agcriando -d agcriando"]
      interval: 10s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512m }

  migrator:
    logging: *logs
    image: ${MIGRATOR_IMAGE:?}
    profiles: [tools]
    depends_on:
      db: { condition: service_healthy }
    command: ["--connection", "Host=db;Database=agcriando;Username=agcriando;Password=${DB_PASSWORD}"]

  api:
    logging: *logs
    image: ${API_IMAGE:?}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ConnectionStrings__Default: Host=db;Database=agcriando;Username=agcriando;Password=${DB_PASSWORD}
      Database__MigrateOnStartup: "false"
      Seed__AdminEmail: ${ADMIN_EMAIL:?}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?}
      Seed__Catalog: "true"
      Storage__Provider: ${STORAGE_PROVIDER:-S3}
      Storage__Bucket: ${MEDIA_BUCKET:-}
      Storage__Region: auto
      Storage__ServiceUrl: ${R2_ENDPOINT:-}
      Storage__PublicBaseUrl: ${MEDIA_BASE_URL:?}
      AWS_ACCESS_KEY_ID: ${MEDIA_R2_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_R2_SECRET_ACCESS_KEY:-}
      Revalidation__Url: http://web:3000/api/revalidate
      Revalidation__Secret: ${REVALIDATE_SECRET:?}
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 400m }

  web:
    logging: *logs
    image: ${WEB_IMAGE:?}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_INTERNAL_URL: http://api:8080
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/robots.txt"]
      interval: 15s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 400m }

  nginx:
    logging: *logs
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:80"   # só o cloudflared (no host) acessa
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    deploy:
      resources:
        limits: { memory: 64m }


  backup:
    logging: *logs
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:-}
      TZ: America/Manaus
    volumes:
      - ./backup:/scripts:ro
      - ./backups:/backups
    entrypoint: ["sh", "/scripts/entrypoint.sh"]
    deploy:
      resources:
        limits: { memory: 128m }

volumes:
  pgdata: {}
  media: {}
