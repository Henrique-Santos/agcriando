name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04-arm
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push das imagens (arm64)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SITE_URL: ${{ vars.SITE_URL }}
          WHATSAPP: ${{ vars.WHATSAPP }}
        run: |
          docker build -t "$REGISTRY/agcriando-api:$SHA" --target runtime backend
          docker build -t "$REGISTRY/agcriando-migrator:$SHA" --target migrator backend
          docker build -t "$REGISTRY/agcriando-web:$SHA" \
            --build-arg NEXT_PUBLIC_SITE_URL="$SITE_URL" --build-arg NEXT_PUBLIC_WHATSAPP="$WHATSAPP" frontend
          for repo in agcriando-api agcriando-migrator agcriando-web; do docker push "$REGISTRY/$repo:$SHA"; done

      - name: Publica os arquivos de infra
        env:
          BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          tar czf infra.tgz -C infra --exclude=local.env --exclude=docker-compose.local.yml --exclude=tests .
          aws s3 cp infra.tgz "s3://$BUCKET/artifacts/infra-$SHA.tgz" --only-show-errors

      - name: Deploy na instância (SSM)
        env:
          BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          params=$(jq -nc --arg sha "$SHA" --arg b "$BUCKET" --arg r "$REGION" '{
            executionTimeout: ["1800"],
            commands: [
              "set -euo pipefail",
              "export HOME=/root AWS_DEFAULT_REGION=\($r) AWS_REGION=\($r)",
              "mkdir -p /opt/agcriando",
              "aws s3 cp s3://\($b)/artifacts/infra-\($sha).tgz /tmp/infra.tgz --only-show-errors",
              "tar xzf /tmp/infra.tgz -C /opt/agcriando",
              "/opt/agcriando/scripts/deploy.sh \($sha)"
            ]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
                --comment "deploy $SHA" --parameters "$params" --query Command.CommandId --output text)
          echo "Comando SSM: $id"
          for _ in $(seq 1 186); do  # até ~31 min, acima do executionTimeout de 30 min
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [ "$status" = Success ] || { echo "::error::Deploy falhou: $status"; exit 1; }
